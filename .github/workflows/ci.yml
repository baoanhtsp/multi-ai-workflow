name: Node 24 TypeScript, PowerShell AST, Pester & API Smoke CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  validate-and-test:
    name: Validate Node 24 TS Server, PowerShell AST, Installer, Pester 5 & API Smoke Tests
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dev Dependencies, Typecheck & Run Node Unit Tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed with exit code $LASTEXITCODE" }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw "npm run typecheck failed with exit code $LASTEXITCODE" }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "npm test failed with exit code $LASTEXITCODE" }

      - name: Validate PowerShell Scripts Syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = Get-ChildItem -Path . -Recurse -Filter "*.ps1" -File | Where-Object { $_.FullName -notmatch '\\node_modules\\' }
          if (-not $scripts) {
              throw "No PowerShell (*.ps1) scripts found in repository."
          }

          $hasSyntaxErrors = $false
          foreach ($script in $scripts) {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors)
              if ($errors -and $errors.Count -gt 0) {
                  $hasSyntaxErrors = $true
                  Write-Host "Syntax error(s) in $($script.FullName):" -ForegroundColor Red
                  foreach ($err in $errors) {
                      Write-Host "  Line $($err.Extent.StartLineNumber): $($err.Message)" -ForegroundColor Red
                  }
              } else {
                  Write-Host "Syntax OK: $($script.FullName)" -ForegroundColor Green
              }
          }

          if ($hasSyntaxErrors) {
              throw "PowerShell syntax validation failed."
          }

      - name: Verify Required Repository Structure
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $requiredFiles = @(
              "README.md",
              "LICENSE",
              "package.json",
              "tsconfig.json",
              "install.ps1",
              "doctor.ps1",
              "start-dashboard.ps1",
              "server/main.ts",
              "server/http.ts",
              "server/lib/registry.ts",
              "templates/SPEC.template.md",
              "antigravity/rules/claude-leader-workflow.md",
              "antigravity/skills/claude-leader/SKILL.md",
              "antigravity/skills/claude-leader/agents.json",
              "antigravity/skills/claude-leader/scripts/lib/maw-common.ps1",
              "antigravity/skills/claude-leader/scripts/lib/maw-registry.ps1",
              "antigravity/skills/claude-leader/scripts/invoke-agent.ps1",
              "antigravity/skills/claude-leader/scripts/invoke-cli-agent.ps1",
              "antigravity/skills/claude-leader/templates/roles/architect.md",
              "antigravity/skills/claude-leader/templates/roles/leader.md",
              "antigravity/skills/claude-leader/templates/roles/backend.md",
              "antigravity/skills/claude-leader/templates/roles/frontend.md",
              "antigravity/skills/claude-leader/templates/roles/reviewer.md",
              "antigravity/skills/claude-leader/templates/roles/tester.md",
              "claude/CLAUDE.md",
              "claude/commands/antigravity.md",
              "codex/AGENTS.md",
              "codex/skills/multi-ai-leader/SKILL.md",
              "codex/skills/multi-ai-leader/agents/openai.yaml",
              "dashboard/index.html",
              "tests/MawCommon.Tests.ps1",
              "tests/SpecGuard.Tests.ps1",
              "tests/InvokeAgent.Tests.ps1",
              "tests/api-smoke.ps1"
          )

          $missing = @()
          foreach ($relPath in $requiredFiles) {
              if (-not (Test-Path -LiteralPath $relPath -PathType Leaf)) {
                  $missing += $relPath
                  Write-Host "Missing required file: $relPath" -ForegroundColor Red
              } else {
                  Write-Host "Found required file: $relPath" -ForegroundColor Green
              }
          }

          if ($missing.Count -gt 0) {
              throw "Repository structure verification failed. Missing: $($missing -join ', ')"
          }

      - name: Test 1-Click Installer (install.ps1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
          if ($LASTEXITCODE -ne 0) {
              throw "install.ps1 exited with code $LASTEXITCODE"
          }

          $installedFiles = @(
              "$env:USERPROFILE\.gemini\config\skills\claude-leader\SKILL.md",
              "$env:USERPROFILE\.gemini\config\skills\claude-leader\agents.json",
              "$env:USERPROFILE\.gemini\config\skills\claude-leader\scripts\lib\maw-common.ps1",
              "$env:USERPROFILE\.gemini\config\skills\claude-leader\scripts\lib\maw-registry.ps1",
              "$env:USERPROFILE\.gemini\config\skills\claude-leader\scripts\invoke-cli-agent.ps1",
              "$env:USERPROFILE\.gemini\config\skills\claude-leader\scripts\start-dashboard.ps1",
              "$env:USERPROFILE\.claude\CLAUDE.md",
              "$env:USERPROFILE\.codex\AGENTS.md",
              "$env:USERPROFILE\.codex\skills\multi-ai-leader\SKILL.md"
          )

          foreach ($target in $installedFiles) {
              if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
                  throw "Installer verification failed: expected file not created at $target"
              }
              Write-Host "Verified installed file: $target" -ForegroundColor Green
          }

      - name: Install Pester 5 & Run Unit Tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.5.0' })) {
              Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -MinimumVersion 5.5 -Force
          Invoke-Pester -Path .\tests -CI

      - name: Run Node.js Backend API Smoke Tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\api-smoke.ps1
          if ($LASTEXITCODE -ne 0) {
              throw "api-smoke.ps1 failed with exit code $LASTEXITCODE"
          }
